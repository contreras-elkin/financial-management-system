name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test and coverage
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/**/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Type check and build
        run: npm run build

  docker:
    name: Docker compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from template
        run: cp .env.example .env

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for API to respond
        run: curl --fail --silent --output /dev/null --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/actuator/health

      - name: Check client API end to end
        env:
          API: http://localhost:8080/api/clients
          BODY: >-
            {"identificationType":"CC","identificationNumber":"1000000001",
            "firstName":"Ana","lastName":"Ruiz","email":"ana.ruiz@mail.com","birthDate":"1990-05-10"}
        run: |
          expect_status() {
            local expected=$1 actual=$2 file=$3
            if [ "$actual" != "$expected" ]; then
              echo "Expected HTTP $expected but got $actual"; cat "$file"; exit 1
            fi
          }

          echo "Create a client"
          status=$(curl -s -o created.json -w '%{http_code}' -X POST "$API" -H 'Content-Type: application/json' -d "$BODY")
          expect_status 201 "$status" created.json
          id=$(jq -er '.id' created.json)
          echo "CLIENT_ID=$id" >> "$GITHUB_ENV"

          echo "Find the created client"
          status=$(curl -s -o found.json -w '%{http_code}' "$API/$id")
          expect_status 200 "$status" found.json
          jq -e '.identificationNumber == "1000000001"' found.json

          echo "Reject a duplicated identification"
          status=$(curl -s -o duplicate.json -w '%{http_code}' -X POST "$API" -H 'Content-Type: application/json' -d "$BODY")
          expect_status 409 "$status" duplicate.json

      - name: Check account API end to end
        env:
          API: http://localhost:8080/api
        run: |
          expect_status() {
            local expected=$1 actual=$2 file=$3
            if [ "$actual" != "$expected" ]; then
              echo "Expected HTTP $expected but got $actual"; cat "$file"; exit 1
            fi
          }

          echo "Open a savings account for the client"
          status=$(curl -s -o account.json -w '%{http_code}' -X POST "$API/accounts" -H 'Content-Type: application/json' \
            -d "{\"clientId\":$CLIENT_ID,\"type\":\"SAVINGS\",\"gmfExempt\":false}")
          expect_status 201 "$status" account.json
          jq -e '(.number | test("^53[0-9]{8}$")) and .status == "ACTIVE" and .balance == 0' account.json
          id=$(jq -er '.id' account.json)

          echo "Cancel the account with zero balance"
          status=$(curl -s -o cancelled.json -w '%{http_code}' -X PATCH "$API/accounts/$id/cancel")
          expect_status 200 "$status" cancelled.json
          jq -e '.status == "CANCELLED"' cancelled.json

          echo "Reject reactivating a cancelled account"
          status=$(curl -s -o reactivated.json -w '%{http_code}' -X PATCH "$API/accounts/$id/activate")
          expect_status 409 "$status" reactivated.json
          jq -e '.code == "INVALID_ACCOUNT_STATUS_TRANSITION"' reactivated.json

          echo "Reject deleting a client with products"
          status=$(curl -s -o delete.json -w '%{http_code}' -X DELETE "$API/clients/$CLIENT_ID")
          expect_status 409 "$status" delete.json
          jq -e '.code == "CLIENT_HAS_PRODUCTS"' delete.json

      - name: Check web and API proxy end to end
        env:
          WEB: http://localhost:3000
        run: |
          expect_status() {
            local expected=$1 actual=$2 file=$3
            if [ "$actual" != "$expected" ]; then
              echo "Expected HTTP $expected but got $actual"; cat "$file"; exit 1
            fi
          }

          echo "Serve the SPA"
          status=$(curl -s -o index.html -w '%{http_code}' --retry 10 --retry-delay 2 --retry-all-errors "$WEB/")
          expect_status 200 "$status" index.html
          grep -q '<div id="root">' index.html

          echo "Fall back to index.html on a client-side route"
          status=$(curl -s -o route.html -w '%{http_code}' "$WEB/clients")
          expect_status 200 "$status" route.html
          grep -q '<div id="root">' route.html

          echo "Reach the API through the proxy"
          status=$(curl -s -o clients.json -w '%{http_code}' "$WEB/api/clients")
          expect_status 200 "$status" clients.json
          jq -e 'any(.[]; .identificationNumber == "1000000001")' clients.json

          echo "Forward API errors through the proxy"
          status=$(curl -s -o missing.json -w '%{http_code}' "$WEB/api/clients/999999")
          expect_status 404 "$status" missing.json
          jq -e '.status == 404' missing.json

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v


